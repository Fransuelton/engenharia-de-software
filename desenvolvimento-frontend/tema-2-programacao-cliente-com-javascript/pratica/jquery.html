<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulando elementos com JQuery</title>
</head>

<body>
    <h1>Manipulando elementos com JQuery</h1>

    <p id="paragraph">Texto</p>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $("#paragraph").html("Novo texto")
    </script>
</body>

</html>
